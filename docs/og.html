<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adjourn social image source</title>
<style>
  /* Rendered to og.jpg at 1200×630 by scripts/og.sh. The laptop-closing photograph, a white wash on the left for the words. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -.03em; color: rgb(14,23,38); background: #fff; }
  img { position: absolute; inset: 0; width: 1200px; height: 630px; object-fit: cover; object-position: 70% 50%; }
  .wash { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(251,245,251,.97) 0%, rgba(251,245,251,.94) 42%, rgba(251,245,251,.55) 58%, rgba(251,245,251,0) 76%); }
  .copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 620px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 22px; margin-bottom: 26px; }
  .brand svg { width: 36px; height: 36px; }
  h1 { margin: 0; font-weight: 500; font-size: 64px; line-height: 1.06; letter-spacing: -.03em; }
  p { margin: 20px 0 0; font-size: 23px; line-height: 1.4; color: rgb(23,37,61); max-width: 520px; }
  .pill { margin-top: 28px; display: inline-block; align-self: flex-start; border-radius: 8px; padding: 10px 18px; font-size: 18px; font-weight: 600; color: #fff; background: #5d5bd4; }
</style>
</head>
<body>
  <img src="img/laptop-closing.jpg" alt="">
  <div class="wash"></div>
  <div class="copy">
    <div class="brand"><svg viewBox="0 0 192 192" aria-hidden="true"><rect width="192" height="192" rx="40" fill="#5d5bd4"/><circle cx="96" cy="96" r="52" fill="none" stroke="#fff" stroke-width="14"/><path d="M96 44a52 52 0 0 1 0 104z" fill="#fff"/></svg>Den Frie Vilje</div>
    <h1>Adjourn: The Democratically Ended Meeting</h1>
    <p>The room votes, anonymously and once each. At the threshold, the meeting ends. A Teams app. Free.</p>
    <span class="pill">Vote to end the meeting</span>
  </div>
</body>
</html>
